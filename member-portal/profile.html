<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My Profile | PNGSA SDSU</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link
    rel="stylesheet"
    href="css/member.css"
  >
</head>


<body>

<div class="member-layout">

  <aside class="member-sidebar">

    <div class="member-sidebar-header">

      <img
        src="../images/pngsa_logo.png"
        alt="PNGSA Logo"
      >

      <h2>PNGSA</h2>

      <span>Member Portal</span>

    </div>


    <nav class="member-nav">

      <a href="dashboard.html">
        <i class="fa-solid fa-house"></i>
        Dashboard
      </a>

      <a
        href="profile.html"
        class="active"
      >
        <i class="fa-solid fa-user"></i>
        My Profile
      </a>

      <a href="vote.html">
        <i class="fa-solid fa-check-to-slot"></i>
        Vote
      </a>

      <a href="../index.html">
        <i class="fa-solid fa-globe"></i>
        PNGSA Website
      </a>

    </nav>


    <button
      id="logoutButton"
      class="member-logout-button"
      type="button"
    >
      <i class="fa-solid fa-right-from-bracket"></i>
      Sign Out
    </button>

  </aside>


  <main class="member-main">

    <header class="member-page-header">

      <div>

        <p class="member-page-label">
          Member Information
        </p>

        <h1>My Profile</h1>

        <p>
          Keep your PNGSA student information up to date.
        </p>

      </div>

      <div class="signed-in-card">
        <span>Signed in as</span>
        <strong id="memberEmail">Loading...</strong>
      </div>

    </header>


    <section class="member-panel profile-form-panel">

      <form id="profileForm">


        <div class="profile-form-grid">


          <div class="form-group">

            <label for="fullName">
              Full Name
            </label>

            <input
              type="text"
              id="fullName"
              required
            >

          </div>


          <div class="form-group">

            <label for="email">
              Email
            </label>

            <input
              type="email"
              id="email"
              readonly
            >

          </div>


          <div class="form-group">

            <label for="major">
              Major
            </label>

            <input
              type="text"
              id="major"
              placeholder="Geographic Information Science"
              required
            >

          </div>


          <div class="form-group">

            <label for="yearOfStudy">
              Year of Study
            </label>

            <select
              id="yearOfStudy"
              required
            >

              <option value="">
                Select year
              </option>

              <option value="Freshman">
                Freshman
              </option>

              <option value="Sophomore">
                Sophomore
              </option>

              <option value="Junior">
                Junior
              </option>

              <option value="Senior">
                Senior
              </option>

              <option value="Graduate">
                Graduate Student
              </option>

              <option value="Other">
                Other
              </option>

            </select>

          </div>


          <div class="form-group full-width">

            <label for="livingArea">
              Living Area
            </label>

            <input
              type="text"
              id="livingArea"
              placeholder="Example: Brookings, Campus Housing, Off Campus"
              required
            >

            <small>
              Please provide a general area only. A street address is not required.
            </small>

          </div>


        </div>


        <div class="profile-actions">

          <button
            type="submit"
            class="member-primary-button"
          >
            <i class="fa-solid fa-floppy-disk"></i>
            Save Profile
          </button>


          <a
            href="dashboard.html"
            class="outline-button"
          >
            Cancel
          </a>

        </div>


        <p
          id="profileMessage"
          class="form-message"
        ></p>

      </form>

    </section>

  </main>

</div>


<script
  type="module"
  src="js/profile.js"
></script>

</body>

</html>
