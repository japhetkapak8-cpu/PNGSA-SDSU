<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        PNGSA Eligible Voters
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #062756;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: #041d3a;
            padding: 30px 18px;
            color: white;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 35px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .sidebar a.active,
        .sidebar a:hover {
            background: #1477bd;
        }

        .main {
            flex: 1;
            padding: 35px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            margin-bottom: 25px;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd5e0;
            border-radius: 7px;
        }

        .member-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border-bottom: 1px solid #e2e7ed;
        }

        .member-row input {
            width: 18px;
            height: 18px;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 11px 17px;
            cursor: pointer;
            margin-right: 8px;
        }

        .primary {
            background: #0875c1;
            color: white;
        }

        .secondary {
            background: #e7edf4;
        }

        .toolbar {
            margin: 18px 0;
        }

    </style>

</head>


<body>

<div class="layout">

    <aside class="sidebar">

        <h2>
            PNGSA
            <br>
            Admin Portal
        </h2>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="members.html">
            Members
        </a>

        <a href="elections.html">
            Elections
        </a>

        <a href="events.html">
            Events
        </a>

        <a href="candidates.html">
            Candidates
        </a>

        <a
            href="voters.html"
            class="active"
        >
            Eligible Voters
        </a>

        <a href="results.html">
            Results
        </a>

    </aside>


    <main class="main">

        <h1>
            Eligible Voters
        </h1>

        <section class="card">

            <label>
                <strong>
                    Election
                </strong>
            </label>

            <br>

            <select id="electionSelect">
            </select>


            <div class="toolbar">

                <button
                    id="selectAllBtn"
                    class="secondary"
                >
                    Select All
                </button>

                <button
                    id="clearAllBtn"
                    class="secondary"
                >
                    Clear All
                </button>

                <button
                    id="saveBtn"
                    class="primary"
                >
                    Save Eligible Voters
                </button>

            </div>


            <p id="message">
            </p>


            <div id="membersList">

                Loading members...

            </div>

        </section>

    </main>

</div>


<script
    type="module"
    src="js/voters.js">
</script>

</body>

</html>
