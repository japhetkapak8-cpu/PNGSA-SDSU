<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        PNGSA Election Results
    </title>


    <style>

        /* =========================================
           GLOBAL
        ========================================= */

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background:
                #f4f6f9;

            color:
                #062756;
        }


        .layout {

            display: flex;

            min-height: 100vh;
        }



        /* =========================================
           SIDEBAR
        ========================================= */

        .sidebar {

            width: 270px;

            min-height: 100vh;

            background:
                #062544;

            color: white;

            padding:
                35px 18px;
        }


        .sidebar-title {

            text-align: center;

            margin-bottom: 40px;
        }


        .sidebar-title h2 {

            margin: 0;

            font-size: 25px;
        }


        .sidebar-title p {

            margin-top: 5px;
        }


        .sidebar a {

            display: block;

            color: white;

            text-decoration: none;

            padding:
                14px 16px;

            margin-bottom: 8px;

            border-radius: 8px;
        }


        .sidebar a:hover,
        .sidebar a.active {

            background:
                #147bc1;
        }



        /* =========================================
           MAIN
        ========================================= */

        .main {

            flex: 1;

            padding: 40px;
        }


        .page-header h1 {

            margin: 0;

            font-size: 34px;
        }


        .page-header p {

            color:
                #526477;

            margin-top: 8px;
        }



        /* =========================================
           CARD
        ========================================= */

        .card {

            background: white;

            border-radius: 14px;

            padding: 28px;

            margin-top: 25px;

            box-shadow:
                0 3px 14px
                rgba(
                    0,
                    0,
                    0,
                    .06
                );
        }



        /* =========================================
           FILTERS
        ========================================= */

        .filters {

            display: grid;

            grid-template-columns:
                220px
                minmax(
                    0,
                    1fr
                );

            gap: 20px;

            align-items: end;
        }


        label {

            display: block;

            font-weight: bold;

            margin-bottom: 8px;
        }


        select {

            width: 100%;

            padding: 13px;

            border:
                1px solid
                #ccd6e0;

            border-radius: 8px;

            font-size: 15px;

            background: white;

            color:
                #062756;
        }



        /* =========================================
           CURRENT ELECTION INFO
        ========================================= */

        .election-info {

            margin-top: 20px;

            padding: 15px 18px;

            border-radius: 10px;

            background:
                #f6f9fc;

            border:
                1px solid
                #e0e7ef;
        }


        .election-info-title {

            font-size: 18px;

            font-weight: bold;

            margin-bottom: 7px;
        }


        .election-info-details {

            display: flex;

            flex-wrap: wrap;

            gap: 12px 24px;

            color:
                #526477;

            font-size: 14px;
        }


        .status-badge {

            display: inline-block;

            border-radius: 20px;

            padding:
                4px 10px;

            font-size: 12px;

            font-weight: bold;
        }


        .status-open {

            background:
                #ddf7e5;

            color:
                #147333;
        }


        .status-closed {

            background:
                #ffe0e0;

            color:
                #9d2020;
        }


        .status-draft {

            background:
                #e7edf4;

            color:
                #40556b;
        }



        /* =========================================
           STATS
        ========================================= */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap: 20px;

            margin-top: 25px;
        }


        .stat-card {

            background: white;

            padding: 24px;

            border-radius: 12px;

            box-shadow:
                0 3px 12px
                rgba(
                    0,
                    0,
                    0,
                    .06
                );
        }


        .stat-card p {

            margin: 0;

            color:
                #526477;

            font-weight: bold;
        }


        .stat-card h2 {

            margin-bottom: 0;

            font-size: 30px;
        }



        /* =========================================
           RESULTS
        ========================================= */

        .position-section {

            margin-top: 30px;
        }


        .position-section h2 {

            border-bottom:
                1px solid
                #e2e7ed;

            padding-bottom: 12px;
        }


        .candidate-result {

            border:
                1px solid
                #dce3eb;

            border-radius: 10px;

            padding: 18px;

            margin-top: 12px;
        }


        .candidate-top {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 15px;
        }


        .candidate-name {

            font-size: 18px;

            font-weight: bold;
        }


        .vote-number {

            font-weight: bold;
        }


        .bar-background {

            width: 100%;

            height: 11px;

            background:
                #e6ebf1;

            border-radius: 20px;

            margin-top: 13px;

            overflow: hidden;
        }


        .bar {

            height: 100%;

            background:
                #147bc1;

            border-radius: 20px;
        }


        .leading {

            display: inline-block;

            background:
                #dff6e5;

            color:
                #157233;

            padding:
                5px 10px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

            margin-left: 8px;
        }


        .empty-message {

            text-align: center;

            padding:
                40px 20px;

            color:
                #526477;
        }



        /* =========================================
           MOBILE
        ========================================= */

        @media(
            max-width: 800px
        ) {

            .sidebar {

                width: 200px;
            }


            .main {

                padding: 25px;
            }


            .stats {

                grid-template-columns:
                    1fr;
            }


            .filters {

                grid-template-columns:
                    1fr;
            }


            .candidate-top {

                flex-direction:
                    column;

                align-items:
                    flex-start;
            }
        }

    </style>

</head>


<body>


<div class="layout">


    <!-- =========================================
         SIDEBAR
    ========================================= -->

    <aside class="sidebar">


        <div class="sidebar-title">

            <h2>
                PNGSA
            </h2>

            <p>
                Admin Portal
            </p>

        </div>


        <a href="dashboard.html">

            Dashboard

        </a>


        <a href="members.html">

            Members

        </a>


        <a href="elections.html">

            Elections

        </a>


        <a href="events.html">

            Events

        </a>


        <a href="candidates.html">

            Candidates

        </a>


        <a href="voters.html">

            Eligible Voters

        </a>


        <a
            href="results.html"
            class="active"
        >

            Results

        </a>


        <a href="../index.html">

            View Website

        </a>


    </aside>



    <!-- =========================================
         MAIN
    ========================================= -->

    <main class="main">


        <div class="page-header">


            <h1>

                Election Results

            </h1>


            <p>

                View PNGSA election participation
                and candidate results.

            </p>


        </div>



        <!-- =========================================
             FILTERS
        ========================================= -->

        <section class="card">


            <div class="filters">


                <div>


                    <label
                        for="yearSelect"
                    >

                        Election Year

                    </label>


                    <select
                        id="yearSelect"
                    >

                        <option value="all">

                            All Years

                        </option>

                    </select>


                </div>



                <div>


                    <label
                        for="electionSelect"
                    >

                        Select Election

                    </label>


                    <select
                        id="electionSelect"
                    >

                        <option value="">

                            Loading elections...

                        </option>

                    </select>


                </div>


            </div>



            <!-- =================================
                 SELECTED ELECTION INFO
            ================================= -->

            <div
                id="electionInfo"
                class="election-info"
                style="display:none;"
            >

            </div>


        </section>



        <!-- =========================================
             SUMMARY
        ========================================= -->

        <div
            class="stats"
            id="summary"
        >


            <div class="stat-card">


                <p>

                    Eligible Voters

                </p>


                <h2
                    id="eligibleCount"
                >

                    0

                </h2>


            </div>



            <div class="stat-card">


                <p>

                    Ballots Submitted

                </p>


                <h2
                    id="ballotCount"
                >

                    0

                </h2>


            </div>



            <div class="stat-card">


                <p>

                    Participation

                </p>


                <h2
                    id="participationCount"
                >

                    0%

                </h2>


            </div>


        </div>



        <!-- =========================================
             CANDIDATE RESULTS
        ========================================= -->

        <section class="card">


            <h2>

                Candidate Results

            </h2>


            <div id="results">


                <div class="empty-message">

                    Loading election results...

                </div>


            </div>


        </section>


    </main>


</div>



<script
    type="module"
    src="js/results.js"
>
</script>


</body>

</html>
